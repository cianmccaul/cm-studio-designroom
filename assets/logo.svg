<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 60" fill="none">
  <defs>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0099bb"/>
    </linearGradient>
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0066aa" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- MARK — Two overlapping rectangles suggesting a screen/frame -->
  <!-- Outer rectangle — the frame -->
  <rect x="2" y="8" width="38" height="44" rx="4" ry="4"
        stroke="url(#mark-grad)" stroke-width="2.5" fill="none"/>
  <!-- Inner rectangle — offset, suggesting depth/screen -->
  <rect x="10" y="16" width="38" height="44" rx="4" ry="4"
        fill="url(#mark-grad)" opacity="0.15"/>
  <rect x="10" y="16" width="38" height="44" rx="4" ry="4"
        stroke="url(#mark-grad)" stroke-width="2.5" fill="none"/>
  <!-- Corner accent dot — top right of inner rect -->
  <circle cx="48" cy="16" r="3.5" fill="url(#accent-grad)"/>

  <!-- WORDMARK -->
  <!-- CM -->
  <text x="62" y="42"
        font-family="'Bebas Neue', 'Arial Black', sans-serif"
        font-size="36"
        font-weight="400"
        letter-spacing="3"
        fill="#ffffff">CM</text>

  <!-- Thin vertical divider -->
  <line x1="118" y1="12" x2="118" y2="48"
        stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- STUDIO -->
  <text x="126" y="42"
        font-family="'Bebas Neue', 'Arial Black', sans-serif"
        font-size="36"
        font-weight="400"
        letter-spacing="3"
        fill="url(#accent-grad)">STUDIO</text>

  <!-- Tagline -->
  <text x="63" y="56"
        font-family="'Syne', 'Arial', sans-serif"
        font-size="7.5"
        font-weight="600"
        letter-spacing="3.5"
        fill="rgba(255,255,255,0.35)">WEB DESIGN &amp; DEVELOPMENT</text>
</svg>
