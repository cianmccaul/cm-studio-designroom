<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CM Studio — Admin</title>
<link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#080808; --bg2:#111; --bg3:#1a1a1a; --bg4:#222;
  --accent:#00e5ff; --accent-dim:rgba(0,229,255,0.1); --accent-b:rgba(0,229,255,0.25);
  --text:#f0f0f0; --text2:#999; --dim:#666; --dimmer:#333;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.14);
  --shadow:rgba(0,0,0,0.5);
}
html, body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; overflow:hidden; }

/* ── LOGIN ── */
#login-screen { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:1000; }
.login-box { width:100%; max-width:380px; padding:2.5rem; }
.login-logo { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:0.1em; margin-bottom:0.2rem; }
.login-logo span { color:var(--accent); }
.login-tagline { font-family:'Syne',sans-serif; font-size:0.65rem; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:var(--dim); margin-bottom:2.5rem; }
.login-field { margin-bottom:1rem; }
.login-label { font-family:'Syne',sans-serif; font-size:0.68rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--dim); display:block; margin-bottom:0.4rem; }
.login-input { width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.9rem; padding:11px 14px; border-radius:6px; outline:none; transition:border-color 0.2s; }
.login-input:focus { border-color:var(--accent); }
.login-btn { width:100%; font-family:'Syne',sans-serif; font-size:0.8rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; background:var(--accent); color:#000; border:none; padding:12px; border-radius:6px; cursor:pointer; margin-top:0.5rem; transition:opacity 0.2s; }
.login-btn:hover { opacity:0.85; }
.login-err { font-size:0.78rem; color:#ff3366; margin-top:0.5rem; display:none; font-family:'Syne',sans-serif; }

/* ── ADMIN LAYOUT ── */
.admin { display:none; height:100vh; overflow:hidden; }
.admin.visible { display:flex; }

/* SIDEBAR */
.sidebar { width:280px; background:var(--bg2); border-right:1px solid var(--border); display:flex; flex-direction:column; flex-shrink:0; }
.sidebar-hdr { padding:1.4rem 1.5rem; border-bottom:1px solid var(--border); }
.sidebar-logo { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:0.1em; }
.sidebar-logo span { color:var(--accent); }
.sidebar-tagline { font-family:'Syne',sans-serif; font-size:0.6rem; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:var(--dim); margin-top:2px; }
.sidebar-search { padding:0.6rem 1rem 0; }
.sidebar-search input { width:100%; background:var(--bg3); border:1px solid var(--border); color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.8rem; padding:7px 10px; border-radius:6px; outline:none; }
.sidebar-search input:focus { border-color:var(--accent); }
.sidebar-filters { display:flex; flex-wrap:wrap; gap:0.3rem; padding:0.55rem 1rem 0.6rem; border-bottom:1px solid var(--border); }
.sf-chip { font-family:'Syne',sans-serif; font-size:0.58rem; font-weight:700; letter-spacing:0.07em; text-transform:uppercase; padding:3px 9px; border-radius:10px; cursor:pointer; border:1px solid var(--border); color:var(--dim); background:transparent; transition:all 0.15s; }
.sf-chip:hover { color:var(--text); border-color:var(--border2); }
.sf-chip.active { background:var(--accent-dim); color:var(--accent); border-color:var(--accent-b); }
.sidebar-list { flex:1; overflow-y:auto; padding:0.75rem; }
.sidebar-section { font-family:'Syne',sans-serif; font-size:0.6rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--dimmer); padding:0.4rem 0.5rem; margin-bottom:0.25rem; }
.sub-item { padding:0.75rem 0.9rem; border-radius:7px; cursor:pointer; transition:all 0.15s; border:1px solid transparent; margin-bottom:0.25rem; position:relative; }
.sub-item:hover { background:rgba(255,255,255,0.03); border-color:var(--border); }
.sub-item.active { background:rgba(0,229,255,0.07); border-color:rgba(0,229,255,0.18); }
.sub-name { font-family:'Syne',sans-serif; font-size:0.82rem; font-weight:700; margin-bottom:2px; }
.sub-meta { font-size:0.68rem; color:var(--dim); margin-bottom:2px; }
.sub-badges { display:flex; gap:0.3rem; flex-wrap:wrap; margin-top:4px; align-items:center; }
.sub-badge { display:inline-block; background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent-b); border-radius:10px; padding:1px 8px; font-size:0.58rem; font-family:'Syne',sans-serif; font-weight:600; }
.priority-badge { border-radius:10px; padding:1px 7px; font-size:0.55rem; font-family:'Syne',sans-serif; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; }
.priority-badge.normal { background:rgba(255,255,255,0.05); color:var(--dim); border:1px solid var(--border); }
.priority-badge.urgent { background:rgba(245,158,11,0.12); color:#f59e0b; border:1px solid rgba(245,158,11,0.3); }
.priority-badge.vip { background:rgba(168,85,247,0.12); color:#a855f7; border:1px solid rgba(168,85,247,0.3); }
.sidebar-footer { padding:1rem 1.5rem; border-top:1px solid var(--border); display:flex; gap:0.5rem; }
.sidebar-footer-btn { flex:1; font-family:'Syne',sans-serif; font-size:0.65rem; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; background:none; border:1px solid var(--border); color:var(--dim); padding:7px; border-radius:5px; cursor:pointer; transition:all 0.2s; text-align:center; }
.sidebar-footer-btn:hover { color:var(--text); border-color:var(--border2); }

/* MAIN PANEL */
.main-panel { flex:1; overflow-y:auto; display:flex; flex-direction:column; min-width:0; }
.main-hdr { padding:1.3rem 2rem; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; position:sticky; top:0; background:var(--bg); z-index:10; backdrop-filter:blur(12px); }
.main-title { font-family:'Syne',sans-serif; font-size:1.15rem; font-weight:800; }
.main-sub { font-size:0.72rem; color:var(--dim); margin-top:2px; }
.stats-bar { display:flex; gap:0.5rem; flex-wrap:wrap; }
.stat-pill { background:var(--bg2); border:1px solid var(--border); border-radius:7px; padding:0.35rem 0.8rem; text-align:center; min-width:55px; }
.stat-pill .sv { font-family:'Syne',sans-serif; font-size:1rem; font-weight:800; color:var(--accent); }
.stat-pill .sl { font-size:0.55rem; color:var(--dim); text-transform:uppercase; letter-spacing:0.08em; }
.main-body { flex:1; padding:1.8rem 2rem 3rem; }

/* EMPTY STATE */
.empty-state { text-align:center; padding:5rem 2rem; color:var(--dimmer); }
.empty-state .ei { font-size:3rem; margin-bottom:1rem; opacity:0.25; }
.empty-state strong { display:block; font-family:'Syne',sans-serif; font-size:1rem; color:var(--dim); margin-bottom:0.4rem; }
.empty-state p { font-size:0.82rem; line-height:1.6; }

/* DETAIL CARDS */
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.4rem; }
.detail-card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:1.2rem; }
.dc-title { font-family:'Syne',sans-serif; font-size:0.62rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--dim); margin-bottom:0.8rem; padding-bottom:0.5rem; border-bottom:1px solid var(--border); }
.dc-row { display:flex; flex-direction:column; gap:0.45rem; }
.dc-field { display:flex; gap:0.5rem; font-size:0.8rem; }
.dc-field .dfl { color:var(--dim); min-width:95px; flex-shrink:0; font-size:0.75rem; }
.dc-field .dfv { color:var(--text); word-break:break-word; line-height:1.5; }

/* SELECTIONS CHIPS */
.sel-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:0.5rem; margin-bottom:1.4rem; }
.sel-chip { background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:0.7rem 1rem; }
.sel-chip .sc-cat { font-size:0.58rem; color:var(--dim); letter-spacing:0.1em; text-transform:uppercase; font-family:'Syne',sans-serif; margin-bottom:2px; }
.sel-chip .sc-val { font-family:'Syne',sans-serif; font-size:0.82rem; font-weight:700; color:var(--accent); }

/* STATUS BAR */
.status-bar { display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap; align-items:center; }
.status-btn { font-family:'Syne',sans-serif; font-size:0.63rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; padding:6px 14px; border-radius:5px; cursor:pointer; transition:all 0.2s; border:1px solid var(--border); background:var(--bg3); color:var(--dim); }
.status-btn:hover { color:var(--text); border-color:var(--border2); }
.status-btn.active-status { background:var(--accent); color:#000; border-color:var(--accent); }
.status-spacer { flex:1; }
.delete-btn { font-family:'Syne',sans-serif; font-size:0.63rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:6px 14px; border-radius:5px; cursor:pointer; transition:all 0.2s; border:1px solid rgba(255,51,102,0.3); background:rgba(255,51,102,0.06); color:#ff3366; }
.delete-btn:hover { background:rgba(255,51,102,0.15); border-color:#ff3366; }

/* PRIORITY ROW */
.priority-row { display:flex; align-items:center; gap:0.6rem; margin-bottom:1.4rem; }
.priority-row label { font-family:'Syne',sans-serif; font-size:0.62rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--dim); }
.priority-select { background:var(--bg3); border:1px solid var(--border); color:var(--text); font-family:'Syne',sans-serif; font-size:0.72rem; font-weight:600; padding:5px 10px; border-radius:5px; cursor:pointer; outline:none; }
.priority-select:focus { border-color:var(--accent); }

/* NOTES */
.notes-card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:1.2rem; margin-bottom:1.4rem; }
.notes-textarea { width:100%; background:rgba(255,255,255,0.03); border:1px solid var(--border); color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.82rem; line-height:1.6; padding:0.75rem; border-radius:6px; outline:none; resize:vertical; min-height:80px; transition:border-color 0.2s; margin-top:0.5rem; }
.notes-textarea:focus { border-color:var(--accent); }
.notes-saved { font-size:0.65rem; color:#4ade80; font-family:'Syne',sans-serif; margin-top:0.3rem; opacity:0; transition:opacity 0.3s; }
.notes-saved.show { opacity:1; }

/* CODE BLOCKS */
.code-section-hdr { display:flex; align-items:center; gap:0.75rem; margin-bottom:0.75rem; margin-top:1.5rem; }
.code-section-title { font-family:'Syne',sans-serif; font-size:0.65rem; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; color:var(--dim); flex:1; }
.code-section-line { flex:1; height:1px; background:var(--border); }
.copy-all-btn { font-family:'Syne',sans-serif; font-size:0.6rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; background:rgba(255,255,255,0.05); color:var(--text2); border:1px solid var(--border); padding:4px 10px; border-radius:4px; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
.copy-all-btn:hover { color:var(--text); border-color:var(--border2); }
.code-block-wrap { background:#0a0a0a; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:0.85rem; }
.code-block-hdr { display:flex; align-items:center; justify-content:space-between; padding:0.55rem 1rem; background:var(--bg3); border-bottom:1px solid var(--border); cursor:pointer; user-select:none; }
.code-block-label { font-family:'Syne',sans-serif; font-size:0.68rem; font-weight:600; color:var(--dim); letter-spacing:0.06em; }
.code-block-actions { display:flex; gap:0.4rem; align-items:center; }
.toggle-btn { font-size:0.7rem; color:var(--dimmer); background:none; border:none; cursor:pointer; padding:2px 4px; transition:color 0.15s; }
.toggle-btn:hover { color:var(--dim); }
.copy-btn { font-family:'Syne',sans-serif; font-size:0.63rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; background:var(--accent-dim); color:var(--accent); border:1px solid var(--accent-b); padding:4px 10px; border-radius:4px; cursor:pointer; transition:all 0.2s; }
.copy-btn:hover { background:rgba(0,229,255,0.2); }
.copy-btn.copied { color:#4ade80; border-color:rgba(74,222,128,0.3); background:rgba(74,222,128,0.08); }
.code-block-body { padding:1rem; overflow-x:auto; max-height:300px; overflow-y:auto; }
.code-block-body.collapsed { display:none; }
.code-block-body pre { font-family:'JetBrains Mono',monospace; font-size:0.74rem; line-height:1.75; color:#c9d1d9; white-space:pre; }

/* BUNDLE SECTION */
.bundle-section { background:linear-gradient(135deg,rgba(0,229,255,0.04),rgba(0,229,255,0.01)); border:1px solid rgba(0,229,255,0.15); border-radius:12px; padding:1.4rem; margin-top:1.5rem; }
.bundle-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem; }
.bundle-title { font-family:'Syne',sans-serif; font-size:0.8rem; font-weight:800; color:var(--accent); letter-spacing:0.1em; text-transform:uppercase; }
.bundle-desc { font-size:0.75rem; color:var(--dim); margin-top:2px; }
.download-all-btn { font-family:'Syne',sans-serif; font-size:0.65rem; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; background:var(--accent); color:#000; border:none; padding:8px 18px; border-radius:6px; cursor:pointer; transition:opacity 0.2s; white-space:nowrap; }
.download-all-btn:hover { opacity:0.85; }
.bundle-files { display:flex; flex-direction:column; gap:0.7rem; }

/* ANALYTICS */
.analytics-card { background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:1.2rem; margin-top:1.4rem; }
.analytics-stats { display:flex; gap:2rem; flex-wrap:wrap; margin-top:0.75rem; }
.an-stat .av { font-family:'Syne',sans-serif; font-size:1.4rem; font-weight:800; color:var(--accent); }
.an-stat .al { font-size:0.62rem; color:var(--dim); text-transform:uppercase; letter-spacing:0.1em; margin-top:2px; }

/* MOOD BOARD */
.mood-grid { display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.75rem; }
.mood-thumb { width:85px; height:85px; object-fit:cover; border-radius:7px; border:1px solid var(--border); cursor:pointer; transition:transform 0.2s; }
.mood-thumb:hover { transform:scale(1.05); }

/* TOAST */
.admin-toast { position:fixed; bottom:2rem; right:2rem; background:var(--bg2); border:1px solid var(--border); color:var(--text); font-family:'Syne',sans-serif; font-size:0.78rem; font-weight:600; padding:11px 22px; border-radius:8px; z-index:2000; opacity:0; transition:all 0.3s; pointer-events:none; }
.admin-toast.show { opacity:1; }
.admin-toast.success { border-color:var(--accent); color:var(--accent); }
.admin-toast.error { border-color:#ff3366; color:#ff3366; }

/* SCROLLBAR */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:10px; }
</style>
</head>
<body>

<div class="admin-toast" id="admin-toast"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">CM <span>STUDIO</span></div>
    <div class="login-tagline">Admin Panel</div>
    <form id="login-form" autocomplete="on">
      <div class="login-field">
        <label class="login-label" for="login-email">Email</label>
        <input class="login-input" type="email" id="login-email" autocomplete="username" required>
      </div>
      <div class="login-field">
        <label class="login-label" for="login-pw">Password</label>
        <input class="login-input" type="password" id="login-pw" autocomplete="current-password" required>
      </div>
      <button class="login-btn" type="submit" id="login-btn">Login →</button>
      <div class="login-err" id="login-err" role="alert">Wrong email or password.</div>
    </form>
  </div>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-hdr">
      <div class="sidebar-logo">CM <span>STUDIO</span></div>
      <div class="sidebar-tagline">Admin Panel</div>
    </div>
    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="Search submissions..." oninput="filterSubmissions(this.value)">
    </div>
    <div class="sidebar-filters" id="sidebar-filters">
      <button class="sf-chip active" data-filter="all" onclick="setFilter('all')">All</button>
      <button class="sf-chip" data-filter="new" onclick="setFilter('new')">New</button>
      <button class="sf-chip" data-filter="inprogress" onclick="setFilter('inprogress')">In Progress</button>
      <button class="sf-chip" data-filter="quoted" onclick="setFilter('quoted')">Quoted</button>
      <button class="sf-chip" data-filter="complete" onclick="setFilter('complete')">Complete</button>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="sidebar-section">Submissions</div>
      <div style="text-align:center;padding:2rem;color:var(--dim);font-size:0.8rem;">Loading...</div>
    </div>
    <div class="sidebar-footer">
      <button class="sidebar-footer-btn" onclick="loadSubmissions()">↻ Refresh</button>
      <button class="sidebar-footer-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-panel">
    <div class="main-hdr">
      <div>
        <div class="main-title" id="main-title">CM Studio Admin</div>
        <div class="main-sub" id="main-sub">Select a submission from the sidebar</div>
      </div>
      <div class="stats-bar" id="stats-bar"></div>
    </div>
    <div class="main-body" id="main-body">
      <div class="empty-state">
        <div class="ei">✦</div>
        <strong>No submission selected</strong>
        <p>Select a client submission from the sidebar to view their brief, selections and generated code.</p>
      </div>
    </div>
  </div>

</div>

<script>
// ── CREDENTIALS ──
const SUPABASE_URL = 'https://keqizgtvunwdabwvgrik.supabase.co';
const SUPABASE_KEY = 'sb_publishable_omG3I_QFY_hpIhCcugVlmA_H2HqvTkm';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let submissions = [];
let filteredSubmissions = [];
let activeId = null;
let activeFilter = 'all';
let searchQuery = '';
let notesTimer = null;

// ── AUTH ──
// Signing in is done by Supabase Auth, and the database itself only lets a
// signed-in admin read or change submissions (see supabase/policies.sql).
// Nothing secret lives in this page.
function showAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin').classList.add('visible');
  loadSubmissions();
}

function showLogin() {
  document.getElementById('admin').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pw').value = '';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.style.display = 'none';
  btn.disabled = true;
  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById('login-email').value.trim(),
    password: document.getElementById('login-pw').value,
  });
  btn.disabled = false;
  if (error) {
    err.style.display = 'block';
    return;
  }
  document.getElementById('login-pw').value = '';
  showAdmin();
});

async function logout() {
  await db.auth.signOut();
  submissions = [];
  filteredSubmissions = [];
  showLogin();
}

db.auth.getSession().then(({ data }) => {
  if (data.session) showAdmin();
});

// ── LOAD DATA ──
async function loadSubmissions() {
  try {
    const { data, error } = await db
      .from('submissions')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) throw error;
    submissions = data || [];
    filteredSubmissions = submissions;
    renderSidebar();
    renderStats();
  } catch (e) {
    console.error(e);
    showToast('Failed to load submissions', 'error');
  }
}

function filterSubmissions(query) {
  searchQuery = query;
  applyFilters();
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.sf-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
  applyFilters();
}

function applyFilters() {
  const q = searchQuery.toLowerCase().trim();
  filteredSubmissions = submissions.filter(s => {
    const matchStatus = activeFilter === 'all' || (s.status || 'new') === activeFilter;
    const matchSearch = !q ||
      (s.client_name || '').toLowerCase().includes(q) ||
      (s.client_email || '').toLowerCase().includes(q) ||
      (s.questionnaire?.business_name || '').toLowerCase().includes(q);
    return matchStatus && matchSearch;
  });
  renderSidebar();
}

// ── STATS ──
function renderStats() {
  const now = new Date();
  const today = submissions.filter(s => new Date(s.created_at).toDateString() === now.toDateString()).length;
  const week  = submissions.filter(s => (now - new Date(s.created_at)) < 7 * 24 * 60 * 60 * 1000).length;
  const inprog = submissions.filter(s => (s.status || 'new') === 'inprogress').length;
  const done   = submissions.filter(s => s.status === 'complete').length;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-pill"><div class="sv">${submissions.length}</div><div class="sl">Total</div></div>
    <div class="stat-pill"><div class="sv">${week}</div><div class="sl">Week</div></div>
    <div class="stat-pill"><div class="sv">${today}</div><div class="sl">Today</div></div>
    <div class="stat-pill"><div class="sv">${inprog}</div><div class="sl">Active</div></div>
    <div class="stat-pill"><div class="sv">${done}</div><div class="sl">Done</div></div>
  `;
}

// ── SIDEBAR ──
function renderSidebar() {
  const el = document.getElementById('sidebar-list');
  if (!filteredSubmissions.length) {
    el.innerHTML = '<div class="sidebar-section">Submissions</div><div style="text-align:center;padding:2rem;color:var(--dim);font-size:0.8rem;">' + (submissions.length ? 'No matches found' : 'No submissions yet') + '</div>';
    return;
  }
  const statusColors = { new:'#00e5ff', inprogress:'#f59e0b', quoted:'#a855f7', complete:'#4ade80' };
  const priorityLabels = { normal:'Normal', urgent:'Urgent', vip:'VIP' };
  el.innerHTML = '<div class="sidebar-section">Submissions — ' + filteredSubmissions.length + '</div>' +
    filteredSubmissions.map(s => {
      const d = new Date(s.created_at);
      const selCount = Object.keys(s.selections || {}).length;
      const status = s.status || 'new';
      const priority = s.priority || 'normal';
      return `<div class="sub-item ${s.id === activeId ? 'active' : ''}" onclick="viewSubmission('${s.id}')">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
          <div class="sub-name">${escHtml(s.client_name) || 'Unknown'}</div>
          <div style="width:7px;height:7px;border-radius:50%;background:${statusColors[status]||'#00e5ff'};flex-shrink:0;"></div>
        </div>
        <div class="sub-meta">${escHtml(s.client_email)}</div>
        <div class="sub-meta">${d.toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'})} · ${d.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'})}</div>
        <div class="sub-badges">
          <span class="sub-badge">${selCount} selection${selCount!==1?'s':''}</span>
          ${priority !== 'normal' ? `<span class="priority-badge ${priority}">${priorityLabels[priority]}</span>` : ''}
        </div>
      </div>`;
    }).join('');
}

// ── VIEW SUBMISSION ──
function viewSubmission(id) {
  activeId = id;
  renderSidebar();
  const s = submissions.find(x => x.id === id);
  if (!s) return;

  const d = new Date(s.created_at);
  document.getElementById('main-title').textContent = s.client_name || 'Submission';
  document.getElementById('main-sub').textContent = `${s.client_email || ''} · Submitted ${d.toLocaleString('en-IE')}`;

  const q = s.questionnaire || {};
  const sel = s.selections || {};
  const status = s.status || 'new';
  const priority = s.priority || 'normal';
  const notes = s.notes || '';
  const statusLabels = { new:'New', inprogress:'In Progress', quoted:'Quoted', complete:'Complete' };
  const allSnippetsId = 'all_snips_' + id;

  document.getElementById('main-body').innerHTML = `

    <!-- STATUS BAR + DELETE -->
    <div class="status-bar">
      ${['new','inprogress','quoted','complete'].map(st => `
        <button class="status-btn ${status===st?'active-status':''}" onclick="updateStatus('${id}','${st}')">
          ${statusLabels[st]}
        </button>`).join('')}
      <span class="status-spacer"></span>
      <button class="delete-btn" onclick="deleteSubmission('${id}')">🗑 Delete</button>
    </div>

    <!-- PRIORITY -->
    <div class="priority-row">
      <label>Priority</label>
      <select class="priority-select" onchange="updatePriority('${id}',this.value)">
        <option value="normal" ${priority==='normal'?'selected':''}>Normal</option>
        <option value="urgent" ${priority==='urgent'?'selected':''}>⚡ Urgent</option>
        <option value="vip" ${priority==='vip'?'selected':''}>👑 VIP</option>
      </select>
    </div>

    <!-- NOTES -->
    <div class="notes-card">
      <div class="dc-title">Private Notes</div>
      <textarea class="notes-textarea" id="notes-area-${id}" placeholder="Add internal notes about this client…" oninput="scheduleNotesSave('${id}')">${escHtml(notes)}</textarea>
      <div class="notes-saved" id="notes-saved-${id}">✓ Saved</div>
    </div>

    <!-- DETAIL GRID -->
    <div class="detail-grid">
      <div class="detail-card">
        <div class="dc-title">Client Details</div>
        <div class="dc-row">
          ${field('Name', s.client_name)}
          ${field('Email', s.client_email)}
          ${field('Business', q.business_name)}
          ${field('Phone', q.phone)}
          ${field('Location', q.location)}
          ${field('What they do', q.what_they_do)}
        </div>
      </div>
      <div class="detail-card">
        <div class="dc-title">Technical</div>
        <div class="dc-row">
          ${field('Domain', q.has_domain)}
          ${field('Domain name', q.domain_name)}
          ${field('Existing site', q.existing_site)}
          ${field('Existing URL', q.existing_url)}
          ${field('Logo', q.has_logo)}
          ${field('Photos', q.has_photos)}
        </div>
      </div>
      <div class="detail-card">
        <div class="dc-title">Pages & Features</div>
        <div class="dc-row">
          ${field('Pages needed', Array.isArray(q.pages_needed) ? q.pages_needed.join(', ') : q.pages_needed)}
          ${field('Features wanted', Array.isArray(q.features_needed) ? q.features_needed.join(', ') : q.features_needed)}
        </div>
      </div>
      <div class="detail-card">
        <div class="dc-title">Style & Branding</div>
        <div class="dc-row">
          ${field('Tagline', q.tagline)}
          ${field('Brand colours', q.brand_colours)}
          ${field('Inspiration', q.inspiration_sites)}
          ${field("Don't wants", q.dont_wants)}
          ${field('Extra notes', q.extra_notes)}
        </div>
      </div>
    </div>

    ${q.services ? `<div class="detail-card" style="margin-bottom:1.4rem;"><div class="dc-title">Services Listed</div><div style="font-size:0.82rem;line-height:1.9;white-space:pre-line;margin-top:0.5rem;color:var(--text2);">${escHtml(q.services)}</div></div>` : ''}
    ${q.homepage_content ? `<div class="detail-card" style="margin-bottom:1.4rem;"><div class="dc-title">Homepage Content Notes</div><div style="font-size:0.82rem;line-height:1.7;white-space:pre-line;margin-top:0.5rem;color:var(--text2);">${escHtml(q.homepage_content)}</div></div>` : ''}
    ${q.social_links ? `<div class="detail-card" style="margin-bottom:1.4rem;"><div class="dc-title">Social Media Links</div><div style="font-size:0.82rem;line-height:1.9;white-space:pre-line;margin-top:0.5rem;color:var(--text2);">${escHtml(q.social_links)}</div></div>` : ''}
    ${q.mood_board_urls && q.mood_board_urls.length ? `<div class="detail-card" style="margin-bottom:1.4rem;"><div class="dc-title">Mood Board Images (${q.mood_board_urls.length})</div><div class="mood-grid">${q.mood_board_urls.filter(url => String(url).startsWith(SUPABASE_URL + '/storage/')).map(url => `<a href="${escHtml(url)}" target="_blank" rel="noopener"><img class="mood-thumb" src="${escHtml(url)}" alt="Mood board"></a>`).join('')}</div></div>` : ''}

    <!-- SELECTIONS -->
    <div class="code-section-hdr">
      <div class="code-section-title">Style Selections</div>
      <div class="code-section-line"></div>
    </div>
    <div class="sel-grid">
      ${Object.entries(sel).map(([k,v]) => `<div class="sel-chip"><div class="sc-cat">${escHtml(k)}</div><div class="sc-val">${escHtml(v)}</div></div>`).join('')}
    </div>

    <!-- ELEMENT CODE BLOCKS -->
    <div class="code-section-hdr">
      <div class="code-section-title">Element Code Snippets</div>
      <div class="code-section-line"></div>
      <button class="copy-all-btn" id="${allSnippetsId}" onclick="copyAllSnippets('${allSnippetsId}')">Copy All Snippets</button>
    </div>
    ${generateAllCodeBlocks(sel, s)}

    <!-- FULL WEBSITE BUNDLE -->
    ${generateBundleSection(sel, s)}

    <!-- ANALYTICS -->
    <div class="analytics-card">
      <div class="dc-title">Submission Summary</div>
      <div class="analytics-stats">
        <div class="an-stat"><div class="av">${Object.keys(sel).length}</div><div class="al">Selections Made</div></div>
        <div class="an-stat"><div class="av">${(q.pages_needed||[]).length}</div><div class="al">Pages Requested</div></div>
        <div class="an-stat"><div class="av">${(q.features_needed||[]).length}</div><div class="al">Features Wanted</div></div>
        <div class="an-stat"><div class="av">${(q.mood_board_urls||[]).length}</div><div class="al">Mood Images</div></div>
        <div class="an-stat"><div class="av">${d.toLocaleDateString('en-IE',{day:'numeric',month:'short'})}</div><div class="al">Submitted</div></div>
      </div>
    </div>
  `;
}

function field(label, val) {
  if (!val) return '';
  return `<div class="dc-field"><span class="dfl">${label}</span><span class="dfv">${escHtml(val)}</span></div>`;
}

// ── STATUS / PRIORITY / DELETE / NOTES ──
async function updateStatus(id, status) {
  try {
    const { error } = await db.from('submissions').update({ status }).eq('id', id);
    if (error) throw error;
    const s = submissions.find(x => x.id === id);
    if (s) s.status = status;
    renderSidebar();
    viewSubmission(id);
    showToast('Status updated ✦', 'success');
  } catch(e) {
    showToast('Failed to update status', 'error');
  }
}

async function updatePriority(id, priority) {
  try {
    const { error } = await db.from('submissions').update({ priority }).eq('id', id);
    if (error) throw error;
    const s = submissions.find(x => x.id === id);
    if (s) s.priority = priority;
    renderSidebar();
    showToast('Priority updated ✦', 'success');
  } catch(e) {
    showToast('Failed to update priority', 'error');
  }
}

async function deleteSubmission(id) {
  if (!confirm('Delete this submission permanently? This cannot be undone.')) return;
  try {
    const { error } = await db.from('submissions').delete().eq('id', id);
    if (error) throw error;
    submissions = submissions.filter(x => x.id !== id);
    activeId = null;
    applyFilters();
    renderStats();
    document.getElementById('main-title').textContent = 'CM Studio Admin';
    document.getElementById('main-sub').textContent = 'Select a submission from the sidebar';
    document.getElementById('main-body').innerHTML = `<div class="empty-state"><div class="ei">✦</div><strong>No submission selected</strong><p>Select a client submission from the sidebar to view their brief, selections and generated code.</p></div>`;
    showToast('Submission deleted', 'success');
  } catch(e) {
    showToast('Failed to delete submission', 'error');
  }
}

function scheduleNotesSave(id) {
  clearTimeout(notesTimer);
  notesTimer = setTimeout(() => saveNotes(id), 1200);
}

async function saveNotes(id) {
  const ta = document.getElementById('notes-area-' + id);
  if (!ta) return;
  const notes = ta.value;
  try {
    const { error } = await db.from('submissions').update({ notes }).eq('id', id);
    if (error) throw error;
    const s = submissions.find(x => x.id === id);
    if (s) s.notes = notes;
    const saved = document.getElementById('notes-saved-' + id);
    if (saved) { saved.classList.add('show'); setTimeout(() => saved.classList.remove('show'), 2000); }
  } catch(e) {
    console.warn('Notes save failed', e);
  }
}

// ── TOAST ──
function showToast(msg, type = '') {
  const t = document.getElementById('admin-toast');
  t.textContent = msg;
  t.className = 'admin-toast show ' + type;
  setTimeout(() => { t.className = 'admin-toast'; }, 3000);
}

// ══════════════════════════════════════
// CODE BLOCK HELPERS
// ══════════════════════════════════════
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function codeBlock(label, code, fixedId) {
  const id = fixedId || 'cb_' + Math.random().toString(36).substr(2,9);
  return `<div class="code-block-wrap">
    <div class="code-block-hdr" onclick="toggleBlock('${id}')">
      <span class="code-block-label">${escHtml(label)}</span>
      <div class="code-block-actions">
        <button class="toggle-btn" id="tog_${id}">▾</button>
        <button class="copy-btn" id="${id}" onclick="event.stopPropagation();copyCode('${id}')">Copy</button>
      </div>
    </div>
    <div class="code-block-body" id="body_${id}"><pre id="pre_${id}">${escHtml(code)}</pre></div>
  </div>`;
}

function toggleBlock(id) {
  const body = document.getElementById('body_' + id);
  const tog = document.getElementById('tog_' + id);
  if (!body) return;
  const collapsed = body.classList.toggle('collapsed');
  if (tog) tog.textContent = collapsed ? '▸' : '▾';
}

async function copyCode(id) {
  const pre = document.getElementById('pre_' + id);
  if (!pre) return;
  await navigator.clipboard.writeText(pre.textContent);
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.textContent = '✓ Copied';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
}

async function copyAllSnippets(btnId) {
  const allPres = document.querySelectorAll('.code-block-body pre');
  const text = Array.from(allPres).map(p => p.textContent).join('\n\n/* ─────────────────────────────── */\n\n');
  await navigator.clipboard.writeText(text);
  const btn = document.getElementById(btnId);
  if (btn) { btn.textContent = '✓ All Copied'; setTimeout(() => { btn.textContent = 'Copy All Snippets'; }, 2500); }
}

// ══════════════════════════════════════
// GENERATE ALL CODE BLOCKS
// ══════════════════════════════════════
function generateAllCodeBlocks(sel, s) {
  const q = (s && s.questionnaire) || {};
  const biz = q.business_name || 'Your Business';
  const tagline = q.tagline || 'Professional services for modern businesses.';
  const phone = q.phone || '+353 87 000 0000';
  const email = (s && s.client_email) ? s.client_email : 'hello@yourbrand.ie';
  const features = Array.isArray(q.features_needed) ? q.features_needed : [];
  const blocks = [];
  if (sel['Colour Scheme'])     blocks.push(codeBlock('Colour Scheme — ' + sel['Colour Scheme'],       getColourCode(sel['Colour Scheme'])));
  if (sel['Background'])        blocks.push(codeBlock('Background — ' + sel['Background'],             getBackgroundCode(sel['Background'])));
  if (sel['Intro / Transition'])blocks.push(codeBlock('Intro — ' + sel['Intro / Transition'],          getIntroCode(sel['Intro / Transition'])));
  if (sel['Navbar'])            blocks.push(codeBlock('Navbar — ' + sel['Navbar'],                     getNavbarCode(sel['Navbar'], biz)));
  if (sel['Hero Section'])      blocks.push(codeBlock('Hero — ' + sel['Hero Section'],                 getHeroCode(sel['Hero Section'], biz, tagline)));
  if (sel['Card Style'])        blocks.push(codeBlock('Cards — ' + sel['Card Style'],                  getCardCode(sel['Card Style'])));
  if (sel['Footer'])            blocks.push(codeBlock('Footer — ' + sel['Footer'],                     getFooterCode(sel['Footer'], biz, phone, email)));
  if (sel['Contact Form'])      blocks.push(codeBlock('Contact Form — ' + sel['Contact Form'],         getFormCode(sel['Contact Form'])));
  if (sel['Scroll Animation'])  blocks.push(codeBlock('Scroll Animation — ' + sel['Scroll Animation'], getAnimCode(sel['Scroll Animation'])));
  if (features.includes('Live Chat') || sel['Feature'])          blocks.push(codeBlock('Feature — Live Chat',           getFeatureCode('chat')));
  if (features.includes('Photo Gallery'))                         blocks.push(codeBlock('Feature — Image Gallery',       getFeatureCode('gallery')));
  if (features.includes('Google Maps'))                           blocks.push(codeBlock('Feature — Google Maps',         getFeatureCode('maps')));
  if (features.includes('WhatsApp Button'))                       blocks.push(codeBlock('Feature — WhatsApp Button',     getFeatureCode('whatsapp', phone)));
  if (features.includes('Cookie Banner'))                         blocks.push(codeBlock('Feature — Cookie Banner',       getFeatureCode('cookie')));
  if (features.includes('Social Media Icons'))                    blocks.push(codeBlock('Feature — Social Icons',        getFeatureCode('social')));
  if (sel['Booking System'] || features.includes('Booking'))      blocks.push(codeBlock('Feature — Booking System',      getFeatureCode('booking')));
  if (sel['Product Shop'])                                        blocks.push(codeBlock('Feature — Product Shop',        getFeatureCode('shop')));
  if (sel['FAQ'])                                                 blocks.push(codeBlock('Feature — FAQ Accordion',       getFeatureCode('faq')));
  if (sel['Newsletter'])                                          blocks.push(codeBlock('Feature — Newsletter Signup',   getFeatureCode('newsletter')));
  if (sel['Reviews'])                                             blocks.push(codeBlock('Feature — Reviews Carousel',   getFeatureCode('reviews')));
  if (sel['Search'])                                              blocks.push(codeBlock('Feature — Site Search',         getFeatureCode('search')));
  return blocks.length ? blocks.join('') : '<div style="color:var(--dim);font-size:0.85rem;padding:1rem 0;">No style selections were made by this client.</div>';
}
