<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DesignRoom Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080808;--bg2:#111;--bg3:#1a1a1a;--accent:#00e5ff;--text:#f0f0f0;--dim:#777;--border:rgba(255,255,255,0.07)}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{width:100%;max-width:380px;padding:2.5rem}
.login-logo{font-family:'Bebas Neue';font-size:2rem;letter-spacing:0.08em;margin-bottom:0.25rem}
.login-logo span{color:var(--accent)}
.login-sub{font-size:0.75rem;color:var(--dim);letter-spacing:0.12em;text-transform:uppercase;font-family:'Syne';margin-bottom:2rem}
.login-field{margin-bottom:1rem}
.login-label{font-family:'Syne';font-size:0.7rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:0.4rem}
.login-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);font-family:'DM Sans';font-size:0.9rem;padding:11px 14px;border-radius:6px;outline:none;transition:border-color 0.2s}
.login-input:focus{border-color:var(--accent)}
.login-btn{width:100%;font-family:'Syne';font-size:0.8rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;background:var(--accent);color:#000;border:none;padding:12px;border-radius:6px;cursor:pointer;margin-top:0.5rem;transition:opacity 0.2s}
.login-btn:hover{opacity:0.85}
.login-err{font-size:0.78rem;color:#ff3366;margin-top:0.5rem;display:none}

/* ADMIN LAYOUT */
.admin{display:none;height:100vh;overflow:hidden}
.admin.visible{display:flex}
.sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-hdr{padding:1.5rem;border-bottom:1px solid var(--border)}
.sidebar-logo{font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:0.08em}
.sidebar-logo span{color:var(--accent)}
.sidebar-sub{font-size:0.62rem;color:var(--dim);letter-spacing:0.15em;text-transform:uppercase;font-family:'Syne';margin-top:2px}
.sidebar-list{flex:1;overflow-y:auto;padding:1rem}
.sidebar-section{font-family:'Syne';font-size:0.62rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--dim);padding:0.5rem 0.75rem;margin-bottom:0.25rem}
.sub-item{padding:0.7rem 0.75rem;border-radius:6px;cursor:pointer;transition:all 0.15s;border:1px solid transparent;margin-bottom:0.25rem}
.sub-item:hover{background:rgba(255,255,255,0.04);border-color:var(--border)}
.sub-item.active{background:rgba(0,229,255,0.08);border-color:rgba(0,229,255,0.2)}
.sub-name{font-family:'Syne';font-size:0.82rem;font-weight:700;margin-bottom:2px}
.sub-meta{font-size:0.68rem;color:var(--dim)}
.sub-badge{display:inline-block;background:rgba(0,229,255,0.15);color:var(--accent);border-radius:10px;padding:1px 7px;font-size:0.6rem;font-family:'Syne';font-weight:600;margin-top:3px}
.sidebar-footer{padding:1rem 1.5rem;border-top:1px solid var(--border)}
.logout-btn{font-family:'Syne';font-size:0.68rem;color:var(--dim);background:none;border:1px solid var(--border);padding:7px 14px;border-radius:5px;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;width:100%;transition:all 0.2s}
.logout-btn:hover{color:var(--text)}

/* MAIN PANEL */
.main-panel{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.main-hdr{padding:1.5rem 2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;background:var(--bg);z-index:10}
.main-title{font-family:'Syne';font-size:1.2rem;font-weight:800}
.main-sub{font-size:0.75rem;color:var(--dim);margin-top:2px}
.stats-bar{display:flex;gap:1rem}
.stat-pill{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:0.4rem 0.9rem;text-align:center}
.stat-pill .sv{font-family:'Syne';font-size:1rem;font-weight:800;color:var(--accent)}
.stat-pill .sl{font-size:0.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:0.08em}
.main-body{flex:1;padding:2rem}

/* EMPTY STATE */
.empty-state{text-align:center;padding:4rem 2rem;color:var(--dim)}
.empty-state .ei{font-size:3rem;margin-bottom:1rem;opacity:0.3}
.empty-state strong{display:block;font-family:'Syne';font-size:1rem;color:var(--text);margin-bottom:0.4rem}

/* SUBMISSION DETAIL */
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
.detail-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:1.2rem}
.dc-title{font-family:'Syne';font-size:0.68rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);margin-bottom:0.8rem}
.dc-row{display:flex;flex-direction:column;gap:0.5rem}
.dc-field{display:flex;gap:0.5rem;font-size:0.82rem}
.dc-field .dfl{color:var(--dim);min-width:110px;flex-shrink:0;font-size:0.78rem}
.dc-field .dfv{color:var(--text);word-break:break-word}
.selections-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.6rem;margin-bottom:1.5rem}
.sel-chip{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:0.7rem 1rem}
.sel-chip .sc-cat{font-size:0.6rem;color:var(--dim);letter-spacing:0.1em;text-transform:uppercase;font-family:'Syne';margin-bottom:2px}
.sel-chip .sc-val{font-family:'Syne';font-size:0.82rem;font-weight:700;color:var(--accent)}

/* CODE BLOCKS */
.code-section{margin-bottom:1.5rem}
.code-section-title{font-family:'Syne';font-size:0.75rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem}
.code-section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.code-block-wrap{background:#0d0d0d;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:1rem}
.code-block-hdr{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 1rem;background:var(--bg3);border-bottom:1px solid var(--border)}
.code-block-label{font-family:'Syne';font-size:0.7rem;font-weight:600;color:var(--dim);letter-spacing:0.08em}
.copy-btn{font-family:'Syne';font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;background:rgba(0,229,255,0.1);color:var(--accent);border:1px solid rgba(0,229,255,0.25);padding:4px 10px;border-radius:4px;cursor:pointer;transition:all 0.2s}
.copy-btn:hover{background:rgba(0,229,255,0.2)}
.copy-btn.copied{color:#4ade80;border-color:rgba(74,222,128,0.3);background:rgba(74,222,128,0.08)}
.code-block-body{padding:1rem;overflow-x:auto;max-height:280px;overflow-y:auto}
.code-block-body pre{font-family:'JetBrains Mono',monospace;font-size:0.75rem;line-height:1.7;color:#c9d1d9;white-space:pre}
.kw{color:#ff7b72}.tag{color:#7ee787}.attr{color:#79c0ff}.str{color:#a5d6ff}.cm{color:#8b949e}.fn{color:#d2a8ff}

/* TOAST */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'Syne';font-size:0.8rem;font-weight:600;padding:12px 24px;border-radius:8px;z-index:2000;opacity:0;transition:all 0.3s;pointer-events:none}
.toast.show{opacity:1}
.toast.success{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo">DESIGN<span>ROOM</span></div>
    <div class="login-sub">Admin Panel</div>
    <div class="login-field">
      <label class="login-label">Password</label>
      <input class="login-input" type="password" id="login-pw" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">Login →</button>
    <div class="login-err" id="login-err">Incorrect password. Try again.</div>
  </div>
</div>

<!-- ADMIN -->
<div class="admin" id="admin">
  <div class="sidebar">
    <div class="sidebar-hdr">
      <div class="sidebar-logo">DESIGN<span>ROOM</span></div>
      <div class="sidebar-sub">Admin Panel</div>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="sidebar-section">Submissions</div>
      <div style="text-align:center;padding:2rem;color:var(--dim);font-size:0.8rem">Loading...</div>
    </div>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="main-panel">
    <div class="main-hdr">
      <div>
        <div class="main-title" id="main-title">DesignRoom Admin</div>
        <div class="main-sub" id="main-sub">Select a submission from the sidebar</div>
      </div>
      <div class="stats-bar" id="stats-bar"></div>
    </div>
    <div class="main-body" id="main-body">
      <div class="empty-state">
        <div class="ei">✦</div>
        <strong>No submission selected</strong>
        Select a client submission from the sidebar to view their brief and generated code.
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://keqizgtvunwdabwvgrik.supabase.co';
const SUPABASE_KEY = 'sb_publishable_omG3I_QFY_hpIhCcugVlmA_H2HqvTkm';
const ADMIN_PASSWORD = 'designroom2025';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let submissions = [];
let activeId = null;

function doLogin() {
  const pw = document.getElementById('login-pw').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin').classList.add('visible');
    loadSubmissions();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

function logout() {
  document.getElementById('admin').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pw').value = '';
}

async function loadSubmissions() {
  const { data, error } = await db.from('submissions').select('*').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  submissions = data || [];
  renderSidebar();
  renderStats();
}

function renderStats() {
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-pill"><div class="sv">${submissions.length}</div><div class="sl">Total</div></div>
    <div class="stat-pill"><div class="sv">${submissions.filter(s=>isToday(s.created_at)).length}</div><div class="sl">Today</div></div>
  `;
}

function isToday(dateStr) {
  const d = new Date(dateStr), now = new Date();
  return d.toDateString() === now.toDateString();
}

function renderSidebar() {
  const el = document.getElementById('sidebar-list');
  if (!submissions.length) {
    el.innerHTML = '<div class="sidebar-section">Submissions</div><div style="text-align:center;padding:2rem;color:var(--dim);font-size:0.8rem">No submissions yet</div>';
    return;
  }
  el.innerHTML = '<div class="sidebar-section">Submissions</div>' + submissions.map(s => {
    const d = new Date(s.created_at);
    const selCount = Object.keys(s.selections || {}).length;
    return `<div class="sub-item ${s.id===activeId?'active':''}" onclick="viewSubmission('${s.id}')">
      <div class="sub-name">${s.client_name || 'Unknown'}</div>
      <div class="sub-meta">${s.client_email || ''}</div>
      <div class="sub-meta">${d.toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'})} · ${d.toLocaleTimeString('en-IE',{hour:'2-digit',minute:'2-digit'})}</div>
      <span class="sub-badge">${selCount} selection${selCount!==1?'s':''}</span>
    </div>`;
  }).join('');
}

function viewSubmission(id) {
  activeId = id;
  renderSidebar();
  const s = submissions.find(x => x.id === id);
  if (!s) return;

  document.getElementById('main-title').textContent = s.client_name || 'Submission';
  document.getElementById('main-sub').textContent = `${s.client_email} · Submitted ${new Date(s.created_at).toLocaleString('en-IE')}`;

  const q = s.questionnaire || {};
  const sel = s.selections || {};

  document.getElementById('main-body').innerHTML = `
    <div class="detail-grid">
      <div class="detail-card">
        <div class="dc-title">Client Details</div>
        <div class="dc-row">
          ${field('Name', s.client_name)}
          ${field('Email', s.client_email)}
          ${field('Business', q.business_name)}
          ${field('Phone', q.phone)}
          ${field('Location', q.location)}
          ${field('What they do', q.what_they_do)}
        </div>
      </div>
      <div class="detail-card">
        <div class="dc-title">Technical</div>
        <div class="dc-row">
          ${field('Domain', q.has_domain)}
          ${field('Domain name', q.domain_name)}
          ${field('Existing site', q.existing_site)}
          ${field('Existing URL', q.existing_url)}
          ${field('Logo', q.has_logo)}
          ${field('Photos', q.has_photos)}
        </div>
      </div>
      <div class="detail-card">
        <div class="dc-title">Pages & Features</div>
        <div class="dc-row">
          ${field('Pages', Array.isArray(q.pages_needed)?q.pages_needed.join(', '):q.pages_needed)}
          ${field('Features', Array.isArray(q.features_needed)?q.features_needed.join(', '):q.features_needed)}
        </div>
      </div>
      <div class="detail-card">
        <div class="dc-title">Content & Style</div>
        <div class="dc-row">
          ${field('Tagline', q.tagline)}
          ${field('Brand colours', q.brand_colours)}
          ${field('Inspiration', q.inspiration_sites)}
          ${field('Don\'t wants', q.dont_wants)}
          ${field('Extra notes', q.extra_notes)}
        </div>
      </div>
    </div>

    ${q.services ? `<div class="detail-card" style="margin-bottom:1rem"><div class="dc-title">Services Listed</div><div style="font-size:0.82rem;line-height:1.8;white-space:pre-line;margin-top:0.5rem">${q.services}</div></div>` : ''}

    <div class="code-section-title">Style Selections</div>
    <div class="selections-grid">
      ${Object.entries(sel).map(([k,v])=>`<div class="sel-chip"><div class="sc-cat">${k}</div><div class="sc-val">${v}</div></div>`).join('')}
    </div>

    <div class="code-section-title">Generated Code</div>
    ${generateCodeBlocks(sel)}
  `;
}

function field(label, val) {
  if (!val) return '';
  return `<div class="dc-field"><span class="dfl">${label}</span><span class="dfv">${val}</span></div>`;
}

function generateCodeBlocks(sel) {
  const blocks = [];

  // BACKGROUND
  if (sel['Background']) {
    blocks.push(codeBlock('Background — ' + sel['Background'], getBackgroundCode(sel['Background'])));
  }
  // NAVBAR
  if (sel['Navbar']) {
    blocks.push(codeBlock('Navbar — ' + sel['Navbar'], getNavbarCode(sel['Navbar'])));
  }
  // HERO
  if (sel['Hero Section']) {
    blocks.push(codeBlock('Hero Section — ' + sel['Hero Section'], getHeroCode(sel['Hero Section'])));
  }
  // COLOUR SCHEME
  if (sel['Colour Scheme']) {
    blocks.push(codeBlock('Colour Scheme — ' + sel['Colour Scheme'], getColourCode(sel['Colour Scheme'])));
  }
  // CARD
  if (sel['Card Style']) {
    blocks.push(codeBlock('Card Style — ' + sel['Card Style'], getCardCode(sel['Card Style'])));
  }
  // FOOTER
  if (sel['Footer']) {
    blocks.push(codeBlock('Footer — ' + sel['Footer'], getFooterCode(sel['Footer'])));
  }
  // FORM
  if (sel['Contact Form']) {
    blocks.push(codeBlock('Contact Form — ' + sel['Contact Form'], getFormCode(sel['Contact Form'])));
  }
  // ANIMATION
  if (sel['Scroll Animation']) {
    blocks.push(codeBlock('Scroll Animation — ' + sel['Scroll Animation'], getAnimCode(sel['Scroll Animation'])));
  }

  return blocks.join('') || '<div style="color:var(--dim);font-size:0.85rem">No style selections were made.</div>';
}

function codeBlock(label, code) {
  const id = 'cb_' + Math.random().toString(36).substr(2,8);
  return `<div class="code-block-wrap">
    <div class="code-block-hdr">
      <span class="code-block-label">${label}</span>
      <button class="copy-btn" id="${id}" onclick="copyCode('${id}')">Copy</button>
    </div>
    <div class="code-block-body"><pre>${escHtml(code)}</pre></div>
  </div>`;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function copyCode(id) {
  const pre = document.getElementById(id).closest('.code-block-wrap').querySelector('pre');
  await navigator.clipboard.writeText(pre.textContent);
  const btn = document.getElementById(id);
  btn.textContent = '✓ Copied';
  btn.classList.add('copied');
  setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('copied'); }, 2000);
}

function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(()=>t.className='toast', 3000);
}

// ── CODE GENERATORS ──
function getColourCode(scheme) {
  const map = {
    'Charcoal + Cyan': {bg:'#0a0a0a',nav:'#111111',accent:'#00e5ff',text:'#f0f0f0',border:'rgba(255,255,255,0.07)'},
    'Navy + Gold': {bg:'#09101e',nav:'#131d30',accent:'#d4a843',text:'#eef0f4',border:'rgba(255,255,255,0.08)'},
    'Black + White': {bg:'#ffffff',nav:'#eeeeee',accent:'#000000',text:'#111111',border:'rgba(0,0,0,0.1)'},
    'Dark + Red': {bg:'#0d0505',nav:'#1a0808',accent:'#e63333',text:'#f5f2f2',border:'rgba(255,255,255,0.07)'},
    'Slate + Emerald': {bg:'#0e141a',nav:'#192028',accent:'#10b981',text:'#e8edf2',border:'rgba(255,255,255,0.07)'},
    'Dark Forest': {bg:'#080d08',nav:'#101a10',accent:'#4ade80',text:'#e8f0e8',border:'rgba(255,255,255,0.07)'},
    'Deep Purple + Violet': {bg:'#120820',nav:'#1e1030',accent:'#a855f7',text:'#f0eaff',border:'rgba(255,255,255,0.08)'},
    'Copper + Orange': {bg:'#0f0a06',nav:'#1e1408',accent:'#e8943a',text:'#f5efe8',border:'rgba(255,255,255,0.07)'},
    'Midnight + Pink': {bg:'#08080a',nav:'#141416',accent:'#ff3366',text:'#ffffff',border:'rgba(255,255,255,0.07)'},
    'Ocean Dark + Teal': {bg:'#060c10',nav:'#0e1820',accent:'#00bcd4',text:'#e8f4ff',border:'rgba(255,255,255,0.07)'},
  };
  const c = map[scheme] || map['Charcoal + Cyan'];
  return `:root {
  --bg: ${c.bg};
  --bg-nav: ${c.nav};
  --accent: ${c.accent};
  --text: ${c.text};
  --border: ${c.border};
}

/* Apply to body */
body {
  background: var(--bg);
  color: var(--text);
}`;
}

function getBackgroundCode(bg) {
  const codes = {
    'Dark Grid': `/* Dark Grid Background */
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 28px 28px;
}`,
    'Gradient Flow': `/* Animated Gradient Flow Background */
body {
  background: linear-gradient(-45deg, #0a0015, #001a2e, #0d1f00, #1a0010);
  background-size: 400% 400%;
  animation: gradFlow 6s ease infinite;
}
@keyframes gradFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}`,
    'Particle Field': `<!-- Add to <body> -->
<canvas id="particles"></canvas>

<style>
#particles {
  position: fixed;
  inset: 0;
  z-index: -1;
  background: #050510;
}
</style>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const pts = Array.from({length: 80}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  vx: (Math.random() - 0.5) * 0.5,
  vy: (Math.random() - 0.5) * 0.5,
  r: Math.random() * 1.5 + 0.5
}));
function draw() {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  pts.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,229,255,0.7)';
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
<\/script>`,
    'Mesh Gradient': `/* Animated Mesh Gradient */
body {
  background:
    radial-gradient(ellipse at 20% 50%, rgba(100,30,200,0.28) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(0,80,200,0.28) 0%, transparent 50%),
    radial-gradient(ellipse at 60% 80%, rgba(200,0,60,0.18) 0%, transparent 50%),
    #080808;

function getAnimCode(anim) {
  const codes = {
    'Fade In Up': `/* Fade In Up Scroll Animation */
/* Add class="fade-up" to any element you want to animate */

<div class="fade-up">Your content here</div>

<style>
.fade-up {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.fade-up.visible {
  opacity: 1;
  transform: translateY(0);
}
</style>

<script>
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('visible');
    }
  });
}, { threshold: 0.15 });

document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
<\/script>`,
    'Stagger Grid': `/* Stagger Grid Animation */

</style>

    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.1 });
document.querySelectorAll('.stagger-item').forEach(el => observer.observe(el));
<\/script>`,
